<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار الميول المهنية</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: #f5f5f5;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

h1 {
  text-align: center;
  color: #138f63;
}

.card {
  background: white;
  padding: 15px;
  margin-bottom: 12px;
  border-radius: 10px;
}

.question {
  font-weight: bold;
  margin-bottom: 10px;
}

.options {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 5px;
}

.options label {
  background: #eee;
  padding: 10px;
  text-align: center;
  border-radius: 8px;
  cursor: pointer;
}

.options input {
  display: none;
}

.options input:checked + label {
  background: #138f63;
  color: white;
}

button {
  width: 100%;
  padding: 15px;
  background: #138f63;
  color: white;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  margin-top: 15px;
}

.result {
  background: #fff;
  padding: 20px;
  margin-top: 20px;
  border-radius: 10px;
}

/* 📱 تحسين الهاتف */
@media (max-width: 600px) {
  .options {
    grid-template-columns: repeat(2, 1fr);
  }
}
</style>
</head>

<body>

<div class="container">

<h1>اختبار الميول المهنية</h1>

<div id="questions"></div>

<button onclick="calculate()">عرض النتيجة</button>

<div id="result" class="result" style="display:none;"></div>

</div>

<script>
const questions = [
  {text:"أحب العمل اليدوي واستخدام الأدوات", type:"R"},
  {text:"أحب التفكير والتحليل", type:"I"},
  {text:"أحب الرسم والإبداع", type:"A"},
  {text:"أحب مساعدة الآخرين", type:"S"},
  {text:"أحب القيادة والتأثير", type:"E"},
  {text:"أحب التنظيم والترتيب", type:"C"},

  {text:"أفضل العمل الميداني", type:"R"},
  {text:"أحب حل المشاكل المعقدة", type:"I"},
  {text:"أحب كتابة أفكار جديدة", type:"A"},
  {text:"أحب العمل مع الناس", type:"S"},
  {text:"أحب إدارة المشاريع", type:"E"},
  {text:"أحب الجداول والنظام", type:"C"}
];

const container = document.getElementById("questions");

questions.forEach((q,i)=>{
  let html = `
  <div class="card">
    <div class="question">${i+1}. ${q.text}</div>
    <div class="options">
      ${[1,2,3,4,5].map(v=>`
        <div>
          <input type="radio" name="q${i}" id="q${i}_${v}" value="${v}">
          <label for="q${i}_${v}">${v}</label>
        </div>
      `).join("")}
    </div>
  </div>
  `;
  container.innerHTML += html;
});

function calculate(){
  let scores = {R:0,I:0,A:0,S:0,E:0,C:0};

  for(let i=0;i<questions.length;i++){
    let selected = document.querySelector(`input[name="q${i}"]:checked`);
    if(!selected){
      alert("جاوب على كل الأسئلة");
      return;
    }
    scores[questions[i].type] += parseInt(selected.value);
  }

  let sorted = Object.entries(scores).sort((a,b)=>b[1]-a[1]);

  document.getElementById("result").style.display = "block";
  document.getElementById("result").innerHTML = `
    <h2>النتيجة</h2>
    <p>أعلى ميول لديك:</p>
    <ul>
      <li>${sorted[0][0]}</li>
      <li>${sorted[1][0]}</li>
      <li>${sorted[2][0]}</li>
    </ul>
  `;
}
</script>

</body>
</html>
